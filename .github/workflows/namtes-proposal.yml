name: Generate NAMTES Proposal PDF

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "namtes/generate_proposal.py"
      - ".github/workflows/namtes-proposal.yml"

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install reportlab

      - name: Generate proposal PDF
        run: python namtes/generate_proposal.py

      - name: Upload generated PDF
        uses: actions/upload-artifact@v4
        with:
          name: namtes-hosting-maintenance-proposal
          path: NAMTES_Platform_Hosting_Maintenance_Proposal.pdf
          if-no-files-found: error
          retention-days: 30
